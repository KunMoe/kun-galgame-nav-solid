# Build the nav image and push to GHCR, then trigger a Dokploy redeploy.
# Same shape as nextmoe-infra/.github/workflows/build.yml, single image.
#
# The site bakes no browser-facing config (links are literal), so there are no
# build-args here — just build the Dockerfile and push.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write            # required to push to GHCR

concurrency:                 # a newer push on the same ref cancels the older build
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/kunmoe/kun-galgame-nav:latest
            ghcr.io/kunmoe/kun-galgame-nav:${{ github.sha }}
          cache-from: type=gha,scope=kun-galgame-nav
          cache-to: type=gha,mode=max,scope=kun-galgame-nav

  deploy:                    # once the image is pushed, tell Dokploy to pull + redeploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK_NAV }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_WEBHOOK_NAV not set — image pushed to GHCR, skipping redeploy trigger."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK"
